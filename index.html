<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Popeye">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Popeye AI</title>
</head>
<body>
<header id="top">
  <button id="btnMenu" class="icon" aria-label="Menu">&#9776;</button>
  <button id="btnChatInfo" class="title" aria-label="Chat details"><span id="chatIcon" class="av sm"></span><span id="chatTitle">Popeye</span></button>
  <button id="btnNew" class="icon" aria-label="New chat">&#65291;</button>
  <button id="btnModel" class="pill" aria-label="Model"><span id="modelPill">No model</span></button>
</header>
<div id="sceneBar" hidden></div>
<div id="loadBar" hidden><div id="loadText"></div><div class="bar"><i id="loadFill"></i></div></div>
<main id="messages"></main>
<footer id="composer">
  <div id="toRow" class="chips" hidden></div>
  <div id="quick" class="chips"></div>
  <div id="tools" class="chips" hidden></div>
  <div id="attachPreview" hidden></div>
  <div class="inputRow">
    <button id="btnAttach" class="icon" aria-label="Attach">&#128206;</button>
    <textarea id="input" rows="1" placeholder="Message" enterkeyhint="send" autocomplete="off"></textarea>
    <button id="btnSend" class="send" aria-label="Send">&#10148;</button>
  </div>
</footer>
<div id="scrim" hidden></div>
<aside id="drawer" aria-hidden="true"></aside>
<section id="sheet" hidden><div id="sheetBody"></div></section>
<div id="toast" hidden></div>
<div id="boot"><div class="bootIn"><img src="icon-192.png" alt=""><div>Popeye AI</div><small id="bootMsg">Starting...</small></div></div>
<script>setTimeout(function(){var b=document.getElementById('boot');if(b&&!b.hidden){document.getElementById('bootMsg').textContent='Still starting. If this stays, close and reopen the app.';}},25000);</script>
<script type="module" src="app.js"></script>
</body>
</html>
